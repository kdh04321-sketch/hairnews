
name: 헤어 뉴스 일일 갱신
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/update_news.py
      - name: 변경 사항 저장
        run: |
          git config user.name "hair-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
